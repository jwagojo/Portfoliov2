<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e26">
<meta name="description" content="Wesley Agojo: Computer Science + Mathematics @ UMass Lowell. A side-scrolling portfolio from UMass Lowell to a Taguig barangay.">
<title>Wesley Agojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600&display=swap">
<style>
/* Shell: three full-screen scenes (title at UMass Lowell, the Taguig barangay, the court), one visible at a time.
   Moving between them plays a short animated transition on #tr while the next scene loads underneath. */
:root { --bg: #120e26; --ink: #f4ece0; --yellow: #f6c343; --red: #d6332a; color-scheme: dark; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
.scene { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
.scene[hidden] { display: none !important; }
.fade {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none;
  background: radial-gradient(circle at 50% 45%, #2a1f4a 0%, #0c0a18 75%); opacity: 0; transition: opacity .45s ease;
}
.fade.on { opacity: 1; pointer-events: auto; }
.fade p { margin: 0; text-align: center; font: 400 clamp(20px, 5vw, 36px)/1.1 "Bungee", "Arial Black", Impact, sans-serif; color: var(--yellow); text-shadow: 3px 3px 0 var(--red); padding: 0 24px; }
.fade small { display: block; margin-top: 10px; font: 600 14px "Fredoka", system-ui, sans-serif; color: #b9afcf; text-shadow: none; }
#tr { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; display: none; }
#tr.on { display: block; pointer-events: auto; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
</style>

<iframe class="scene" id="s-title" title="Title screen: UMass Lowell North Campus" allow="autoplay"></iframe>
<iframe class="scene" id="s-hub" title="The barangay: Wesley's portfolio street in Taguig" allow="autoplay" hidden></iframe>
<iframe class="scene" id="s-court" title="The barangay basketball court" allow="autoplay" hidden></iframe>
<div class="fade" id="fade"><p id="fade-text"></p></div>
<canvas id="tr" aria-hidden="true"></canvas>
<p class="sr" id="tr-say" aria-live="polite"></p>

<script>
  // Each scene is its own page. They ask the shell to move on with postMessage({ go: 'hub' | 'court' | 'title', from });
  // the shell plays a transition, swaps which frame is visible, and tells the scenes to pause or resume.
  const SRC = { title: 'title.html', hub: 'hub.html', court: 'court.html' };
  const LINES = {
    hub: ['NEXT STOP:<br>TAGUIG CITY', 'Welcome to the barangay'],
    court: ['DOWN THE ESKINITA', 'To the court'],
    back: ['BACK TO THE STREET', ''],
    title: ['UMASS LOWELL', 'North Campus'],
  };
  const frames = { title: document.getElementById('s-title'), hub: document.getElementById('s-hub'), court: document.getElementById('s-court') };
  const fade = document.getElementById('fade'), fadeText = document.getElementById('fade-text'), say = document.getElementById('tr-say');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current = null, busy = false;

  const post = (name, msg) => { try { frames[name].contentWindow.postMessage(msg, '*'); } catch (e) {} };
  function load(name) { return new Promise((res) => { const f = frames[name]; if (f.dataset.loaded) return res(); f.addEventListener('load', () => { f.dataset.loaded = '1'; res(); }, { once: true }); f.src = SRC[name]; }); }
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
  const isMuted = (name) => { try { const b = frames[name].contentDocument.getElementById('mute'); return !!b && b.getAttribute('aria-pressed') === 'true'; } catch (e) { return false; } };

  // ================= the transition player =================
  const cv = document.getElementById('tr'), c = cv.getContext('2d');
  let W = 1, H = 1, DPR = 1;
  function size() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  window.addEventListener('resize', size);
  const OL = '#16121c', DISP = '"Bungee", "Arial Black", Impact, sans-serif', UI = '"Fredoka", system-ui, sans-serif';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t * t * (3 - 2 * t), easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // --- sound (made on the spot, like the scenes do) ---
  let AC = null, mute = false;
  function au() { if (mute) return null; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { return null; } return AC; }
  function noise(dur, f0, f1, vol, q = 1, delay = 0) {
    const a = au(); if (!a) return; const t = a.currentTime + delay, n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + 0.05);
  }
  function tone(f0, f1, dur, type, vol, delay = 0) {
    const a = au(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function engine(dur) {   // a diesel idle that pulls away: low sawtooth through a lowpass, putt-putt from an LFO
    const a = au(); if (!a) return; const t = a.currentTime, o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain(), l = a.createOscillator(), lg = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(48, t); o.frequency.linearRampToValueAtTime(62, t + dur * 0.7); o.frequency.linearRampToValueAtTime(40, t + dur);
    f.type = 'lowpass'; f.frequency.value = 320; l.frequency.value = 11; lg.gain.value = 0.03; l.connect(lg).connect(g.gain);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.2); g.gain.setValueAtTime(0.07, t + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
  }
  function shout(text) {   // someone down the alley; falls back to just the bubble if the browser has no voices
    say.textContent = text;
    if (mute) return;
    try { const u = new SpeechSynthesisUtterance(text); u.rate = 1.2; u.pitch = 1.15; u.volume = 1; const v = speechSynthesis.getVoices().find((x) => /en[-_](US|PH|GB)/i.test(x.lang)); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }

  // --- shared drawing ---
  function rr(x, y, w, h, r, fill, lw) { c.beginPath(); c.roundRect(x, y, w, h, r); if (fill) { c.fillStyle = fill; c.fill(); } if (lw) { c.lineWidth = lw; c.strokeStyle = OL; c.stroke(); } }
  function caption(big, small, a, y) {
    if (a <= 0) return; c.save(); c.globalAlpha = a; c.textAlign = 'center';
    const fs = clamp(Math.min(W * 0.065, H * 0.08), 20, 44); c.font = `${fs}px ${DISP}`;
    c.fillStyle = '#d6332a'; c.fillText(big, W / 2 + 3, y + 3); c.fillStyle = '#f6c343'; c.fillText(big, W / 2, y);
    if (small) { c.font = `600 ${clamp(fs * 0.42, 12, 17)}px ${UI}`; c.fillStyle = '#efe6ff'; c.fillText(small, W / 2, y + fs * 0.75); }
    c.restore();
  }
  function puff(x, y, r, a, col = '233,228,220') {
    if (a <= 0.01 || r <= 0) return; const g = c.createRadialGradient(x, y, r * 0.1, x, y, r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.6, `rgba(${col},${a * 0.75})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }

  // ---------- characters: one rigged chibi model, drawn in code ----------
  // Wesley, Han, Joy, Randy and Justin are "looks" modelled on their reference sheets; every townsperson uses the same rig.
  // A pose is a set of joint angles (0 = hanging straight down, + = swung toward the way they face), so any pose,
  // cycle or prop is under control. draw() returns where the hands ended up, for props held by the caller.
  const RIG = (() => {
    const OL = '#1b1722', OW = 2.5;
    const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.max(0, Math.min(255, Math.round(v * k))); return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1); };
    const V = (a, L) => [Math.sin(a) * L, Math.cos(a) * L];
    const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    function stroke(c, pts, w, col) { c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = w; c.strokeStyle = col; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); }
    function blob(c, x, y, r, col, ow = OW) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = col; c.fill(); if (ow) { c.lineWidth = ow; c.strokeStyle = OL; c.stroke(); } }
    function ell(c, x, y, rx, ry, col, ow = OW, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, 7); c.fillStyle = col; c.fill(); if (ow) { c.lineWidth = ow; c.strokeStyle = OL; c.stroke(); } }
    function rrect(c, x, y, w, h, r, col, ow = OW) { c.beginPath(); c.roundRect(x, y, w, h, r); c.fillStyle = col; c.fill(); if (ow) { c.lineWidth = ow; c.strokeStyle = OL; c.stroke(); } }

    // ---- the cast, from the reference sheets ----
    const LOOKS = {
      rj: { skin: '#e39a5e', hair: '#2b2328', hairStyle: 'mop', eyeW: 0.92, eyeH: 0.86, blush: 0.16, top: '#5d5c64', pants: '#5d5c64', shoe: '#1f1d24', sole: '#f4f1ea', sleeve: 'long', torso: 'suit', tie: '#8e2b36', shirt: '#f4f1ea' },
      han: { skin: '#f2b07a', hair: '#3a2b27', hairStyle: 'longHan', top: '#2d2b32', pants: '#2d2b32', shoe: '#1f1d24', sole: '#f4f1ea', sleeve: 'long', torso: 'scarf', scarf: '#8e8c93', earring: true },
      justin: { skin: '#e39c62', hair: '#16131a', hairStyle: 'spiky', glasses: true, top: '#c0d8ee', dots: '#86a6c6', pants: '#b79c7a', shoe: '#f2f0ea', sole: '#d8d4cc', sleeve: 'short', torso: 'polo' },
      randy: { skin: '#d9935a', hair: '#2a2124', hairStyle: 'beanie', beanie: '#c8c8cc', patch: '#7a5236', top: '#88b6e6', vest: '#5e4535', hood: '#a68d70', pants: '#4f4d58', shoe: '#2a2830', sole: '#f4f1ea', sleeve: 'long', torso: 'vest' },
      joy: { skin: '#e8a46e', hair: '#2a2024', hairStyle: 'beaniePom', beanie: '#cbcbcf', glasses: true, top: '#2f3452', shirt: '#efc8ca', pants: '#38363f', shoe: '#f0eee8', sole: '#d8d4cc', sleeve: 'long', torso: 'puffer' },
    };

    // ---- poses ----
    const BASE = () => ({ lean: 0, bob: 0, tilt: 0, aN: [0.1, 0.12], aF: [-0.06, 0.12], lN: [0.02, 0], lF: [-0.02, 0], air: false, blink: false, mouth: 'smile' });
    function pose(name, t, o = {}) {
      const P = BASE(), T = Math.PI * 2;
      switch (name) {
        case 'idle': default: {
          P.bob = Math.sin(t * 2.2) * 0.5; P.aN = [0.1 + Math.sin(t * 2.2) * 0.02, 0.14]; P.aF = [-0.06, 0.14];
          P.blink = ((t % 3.7) + 3.7) % 3.7 < 0.13; break;
        }
        case 'walk': {   // t = phase 0..1
          const th = t * T, s = Math.sin(th);
          P.lN = [0.42 * s, 0.12 + 0.55 * Math.max(0, -Math.cos(th))]; P.lF = [-0.42 * s, 0.12 + 0.55 * Math.max(0, Math.cos(th))];
          P.aN = [-0.42 * s, 0.25]; P.aF = [0.42 * s, 0.25]; P.bob = -Math.abs(Math.cos(th)) * 1.6; P.lean = 0.04; break;
        }
        case 'run': {
          const th = t * T, s = Math.sin(th), cN = Math.cos(th);
          // the leg swinging forward folds tight under the hip, the planted one drives back nearly straight
          P.lN = [0.85 * s + 0.1, 0.2 + 1.35 * Math.max(0, cN) * (s > -0.3 ? 1 : 0.6)];
          P.lF = [-0.85 * s + 0.1, 0.2 + 1.35 * Math.max(0, -cN) * (-s > -0.3 ? 1 : 0.6)];
          P.aN = [-0.8 * s + 0.1, 1.25]; P.aF = [0.8 * s + 0.1, 1.25];
          P.lean = 0.2; P.bob = -Math.abs(Math.sin(th)) * 3.2 + 1; break;
        }
        case 'jump': P.air = true; P.lN = [0.75, 1.5]; P.lF = [0.25, 1.1]; P.aN = [4.0, -0.3]; P.aF = [2.3, 0.3]; P.lean = 0.05; break;
        case 'fall': P.air = true; P.lN = [0.3, 0.45]; P.lF = [-0.1, 0.35]; P.aN = [1.9, 0.25]; P.aF = [1.6, 0.25]; break;
        case 'land': P.lN = [0.75, 1.35]; P.lF = [0.6, 1.25]; P.aN = [0.8, 0.4]; P.aF = [0.6, 0.4]; P.lean = 0.28; break;
        case 'crouch': P.lN = [0.95, 1.9]; P.lF = [0.8, 1.8]; P.aN = [0.9, 0.7]; P.aF = [0.8, 0.7]; P.lean = 0.3; break;
        case 'sit': P.lN = [1.48, 1.48]; P.lF = [1.42, 1.42]; P.aN = [0.55, 0.75]; P.aF = [0.45, 0.8]; P.sit = true; break;
        case 'ready': P.lN = [0.62, 1.05]; P.lF = [0.48, 0.95]; P.aN = [0.85, 0.35]; P.aF = [0.75, 0.35]; P.lean = 0.22; break;
        case 'bump': P.lN = [0.72, 1.25]; P.lF = [0.6, 1.15]; P.aN = [1.12, 0]; P.aF = [1.08, 0]; P.lean = 0.3; break;
        case 'set': P.lN = [0.2, 0.35]; P.lF = [0.1, 0.3]; P.aN = [4.15, -0.55]; P.aF = [2.45, 0.4]; P.tilt = -0.15; break;
        case 'toss': P.aF = [2.45, 0.4]; P.aN = [0.25, 0.3]; P.tilt = -0.1; break;
        case 'spikeback': P.air = true; P.lN = [0.6, 1.3]; P.lF = [0.15, 0.8]; P.aN = [4.3, 0.6]; P.aF = [2.3, 0.2]; P.lean = -0.08; P.tilt = -0.15; break;
        case 'spikehit': P.air = true; P.lN = [0.5, 1.1]; P.lF = [0.05, 0.7]; P.aN = [-0.4, 0.3]; P.aF = [2.1, -0.2]; P.lean = 0.16; break;
        case 'shoot': P.lN = [0.15, 0.3]; P.lF = [0.05, 0.25]; P.aN = [4.1, -0.5]; P.aF = [2.5, 0.35]; P.tilt = -0.12; break;
        case 'hold': P.aN = [0.7, 1.15]; P.aF = [0.6, 1.25]; break;
        case 'carry': P.aN = [0.3, 1.1]; P.aF = [-0.2, 0.2]; { const w = pose('walk', t); P.lN = w.lN; P.lF = w.lF; P.bob = w.bob; P.aF = [w.aF[0], 0.25]; } break;
        case 'armsup': case 'cheer': { const k = Math.sin(t * 9) * 0.12; P.aN = [4.25 + k, -0.5]; P.aF = [2.35 - k, 0.3]; P.tilt = -0.08; break; }
        case 'wave': P.aN = [4.2, -0.6 + Math.sin(t * 11) * 0.35]; break;
        case 'point': case 'fob': P.aN = [1.55, 0.04]; P.aF = [-0.05, 0.15]; break;
        case 'pin': P.aN = [0.45, 1.55]; P.aF = [0.35, 1.65]; P.tilt = 0.1; P.mouth = 'o'; break;
        case 'throw': { const k = clamp(o.k || 0, 0, 1), e = 1 - Math.pow(1 - k, 3); P.aN = [4.3 - e * 2.5, 0.7 - e * 0.65]; P.aF = [1.0 - e * 0.9, 0.3]; P.lean = -0.1 + e * 0.25; P.lN = [0.25 * e, 0.1]; P.lF = [-0.3 * e, 0.15]; break; }
        case 'hang': P.aN = [4.1, -0.5]; P.aF = [0.35, 0.35]; P.lN = [0.25, 0.3]; P.lF = [-0.1, 0.2]; break;
        case 'lean': P.lean = -0.1; P.aN = [-0.55, 0.35]; P.aF = [0.15, 0.55]; P.lN = [0.2, 0]; P.lF = [-0.15, 0]; break;
        case 'tie': P.aN = [0.5, 2.05 + Math.sin(t * 6) * 0.1]; P.aF = [-0.05, 0.12]; P.tilt = 0.12; break;
        case 'film': P.aN = [1.6, 1.25]; P.aF = [1.35, 1.5]; P.tilt = 0.05; P.prop = 'camera'; break;
        case 'talk': P.aN = [0.55, 0.9 + Math.sin(t * 7) * 0.25]; P.mouth = Math.sin(t * 14) > 0 ? 'o' : 'smile'; break;
        case 'hop': { const s = Math.abs(Math.sin(t * 6)); P.air = true; P.lN = [0.2, 0.25]; P.lF = [-0.6, 1.5]; P.aN = [0.6, 0.4]; P.aF = [-0.4, 0.4]; P.hopY = s * 12; break; }
        case 'squat': P.lN = [1.1, 2.3]; P.lF = [0.95, 2.2]; P.aN = [0.7, 0.9]; P.aF = [0.55, 0.9]; P.lean = 0.25; break;
      }
      return P;
    }

    // ---- drawing ----
    const G = { hipY: -32, thigh: 16, shin: 14, upper: 14, fore: 13, legW: 12.5, armW: 9, hand: 5.4, torsoH: 25, torsoW: 28 };
    function draw(c, look, P, opt = {}) {
      const L = typeof look === 'string' ? LOOKS[look] : look;
      c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
      // where the hips sit: feet on the ground unless airborne
      const legEnd = (l, hip) => { const k = add(hip, V(l[0], G.thigh)); return [k, add(k, V(l[0] - l[1], G.shin))]; };
      const hipN0 = [-4, 0], hipF0 = [5, 0];
      const [, fN] = legEnd(P.lN, hipN0), [, fF] = legEnd(P.lF, hipF0);
      let hipY = P.air ? G.hipY : -(Math.max(fN[1], fF[1]) + 2.2);
      hipY += P.bob - (P.hopY || 0);
      if (opt.shadow !== false) { const a = P.air ? 0.15 : 0.26; c.fillStyle = `rgba(10,6,16,${a})`; c.beginPath(); c.ellipse(1, 0.5, 15, 3.2, 0, 0, 7); c.fill(); }
      c.translate(0, hipY);
      // torso frame (leans about the hips)
      const tor = new DOMMatrix().rotate(P.lean * 57.2958);
      const TP = (p) => { const q = tor.transformPoint({ x: p[0], y: p[1] }); return [q.x, q.y]; };
      const shN = TP([-8.5, -G.torsoH + 4.5]), shF = TP([9.5, -G.torsoH + 4.5]);
      const arm = (sh, a) => { const e = add(sh, V(a[0], G.upper)); return [e, add(e, V(a[0] + a[1], G.fore))]; };
      const [eN, hN] = arm(shN, P.aN), [eF, hF] = arm(shF, P.aF);
      const legs = [[P.lF, hipF0, true], [P.lN, hipN0, false]];
      // back layer: long hair behind the body, far arm, far leg
      c.save(); c.setTransform(c.getTransform().multiply(tor)); hairBack(c, L, P); c.restore();
      drawArm(c, L, shF, eF, hF, true);
      for (const [l, hip, back] of legs) if (back || !P.sit) drawLeg(c, L, hip, ...legEnd(l, hip), back, l);
      // torso and head
      c.save(); c.setTransform(c.getTransform().multiply(tor)); drawTorso(c, L, P); c.restore();
      if (P.sit) { const l = P.lN; drawLeg(c, L, hipN0, ...legEnd(l, hipN0), false, l); }
      const raisedN = hN[0] < -6 && hN[1] < shN[1] - 6 && P.prop !== 'camera';
      if (raisedN) drawArm(c, L, shN, eN, hN, false);
      c.save(); c.setTransform(c.getTransform().multiply(tor)); c.translate(1, -G.torsoH + 1); c.rotate(P.tilt || 0); drawHead(c, L, P, opt.t || 0); c.restore();
      if (raisedN) { /* drawn already, behind the head */ }
      if (P.prop === 'camera') drawCamera(c, (hN[0] + hF[0]) / 2 + 1, (hN[1] + hF[1]) / 2 - 1);

            c.fillStyle = 'rgba(255,220,150,.75)'; for (let wy = roadY - bh + 12; wy < roadY - 40; wy += 26) for (let wx = mx + 10; wx < mx + bw - 22; wx += 26) if (hash(k * 7 + wx * 0.01 + wy * 0.03) > 0.4) c.fillRect(wx, wy, 14, 14);
            rr(mx + 6, roadY - 30, bw - 12, 30, 2, 'rgba(20,14,30,.6)'); }
          mx += bw + 6;
        }
        // poles and wires, a little faster than the road's edge
        const pspan = Math.max(260, W * 0.42), off3 = (T.pos * 0.85) % pspan;
        c.strokeStyle = 'rgba(20,14,30,.85)'; c.lineWidth = 1.2;
        for (let px = -off3 - pspan; px < W + pspan; px += pspan) { c.beginPath(); c.moveTo(px, H * 0.2); c.quadraticCurveTo(px + pspan / 2, H * 0.27, px + pspan, H * 0.2); c.stroke(); c.beginPath(); c.moveTo(px, H * 0.24); c.quadraticCurveTo(px + pspan / 2, H * 0.31, px + pspan, H * 0.24); c.stroke(); }
        for (let px = -off3; px < W + pspan; px += pspan) { c.fillStyle = '#2d2438'; c.fillRect(px - 4, H * 0.17, 8, roadY - H * 0.17); c.fillRect(px - 18, H * 0.19, 36, 4); }
        // road
        c.fillStyle = '#9a948c'; c.fillRect(0, roadY - 6, W, 8); c.fillStyle = '#3a3640'; c.fillRect(0, roadY + 2, W, H - roadY);
        const dspan = 90, off4 = T.pos % dspan; c.fillStyle = '#f2e7c4'; for (let dx = -off4; dx < W; dx += dspan) c.fillRect(dx, roadY + (H - roadY) * 0.55, 46, 5);
        // the jeepney: dips its nose when the brakes bite, then rocks back
        const L = Math.min(W * (W < H ? 0.8 : 0.62), H * 0.95, 640), jx = W * (W < H ? 0.48 : 0.42) + (t > this.TB ? easeOut(clamp((t - this.TB) / this.BD, 0, 1)) * W * 0.05 : 0), jy = roadY + (H - roadY) * 0.32;
        const u = t - this.TB; let pitch = 0;

        drawJeep(jx, jy + bounce, L, T.pos / (L * 0.08), pitch);

        caption('NEXT STOP: TAGUIG CITY', 'Welcome to the barangay', clamp((t - 0.25) / 0.35, 0, 1) * clamp((this.TB + 0.3 - t) / 0.3, 0, 1), H * 0.16);
        c.restore();
      }
      // smoke: rolls out from the tyres, then the cloud swallows the screen
      const cover = clamp((t - this.TB - 0.45) / (this.cover - this.TB - 0.45), 0, 1), rv = T.state === 'reveal' ? T.r / 0.8 : 0;
      if (T.state === 'play' && t > this.TB + 0.35) for (let k = 0; k < 3; k++) T.smoke.push({ x: Math.random() * W, y: H * (0.3 + Math.random() * 0.8), vx: (Math.random() - 0.5) * 60, vy: -20 - Math.random() * 40, r: 30 + Math.random() * 40, gr: 160 + Math.random() * 160, a: 0.9 });
      for (const p of T.smoke) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.r += p.gr * dt; p.gr *= 0.985; if (T.state === 'reveal') { p.a -= dt * 1.6; p.vy -= 60 * dt; } }
      T.smoke = T.smoke.filter((p) => p.a > 0.02 && p.r < Math.max(W, H) * 1.5);
      const full = cover * (1 - ease(clamp(rv, 0, 1)));
      if (full > 0) { c.fillStyle = `rgba(226,221,214,${full})`; c.fillRect(0, 0, W, H); }
      for (const p of T.smoke) puff(p.x, p.y, p.r, p.a * (T.state === 'reveal' ? 1 : 1));
      if (T.state === 'reveal' && rv >= 1 && !T.smoke.length) return true;
      if (T.state === 'reveal' && rv >= 1.6) return true;
    },
  };

  // ---------- 2. down the eskinita: "Heads up!" ----------
  function alley(T, scroll, toward) {   // the eskinita: hollow-block walls, pipes, laundry, a lit window, the court's glow at one end
    const gY = H * 0.8;
    const sk = c.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#1d1636'); sk.addColorStop(1, '#3a2b4a'); c.fillStyle = sk; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,214,140,.10)'; c.fillRect(0, 0, W, H * 0.12);
    // back wall
    const off = scroll * 0.55, bw = 46, bh = 22;
    c.fillStyle = '#8f8a84'; c.fillRect(0, H * 0.1, W, gY - H * 0.1);
    c.strokeStyle = 'rgba(50,46,52,.28)'; c.lineWidth = 1;
    for (let y = H * 0.1, r = 0; y < gY; y += bh, r++) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); for (let x = -((off + (r % 2) * bw / 2) % bw); x < W; x += bw) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + bh); c.stroke(); } }
    // stains, a pipe, windows, a door, laundry: placed along the alley and scrolled
    const span = Math.max(W * 1.3, 900);
    for (let k = -1; k < 3; k++) {
      const o = k * span - (off % span);
      c.fillStyle = 'rgba(60,52,50,.18)'; c.fillRect(o + span * 0.1, H * 0.1, 30, gY - H * 0.1);
      const wx = o + span * 0.22, wy = H * 0.3; c.fillStyle = '#ffd889'; c.fillRect(wx, wy, 70, 56); c.strokeStyle = '#2a2236'; c.lineWidth = 2; for (let i = 1; i < 5; i++) { c.beginPath(); c.moveTo(wx + i * 14, wy); c.lineTo(wx + i * 14, wy + 56); c.stroke(); } c.strokeStyle = OL; c.lineWidth = 2.5; c.strokeRect(wx, wy, 70, 56);
      c.fillStyle = '#5a6270'; c.fillRect(o + span * 0.47, H * 0.1, 8, gY - H * 0.1); c.fillRect(o + span * 0.47 - 6, H * 0.45, 20, 6);
      rr(o + span * 0.62, gY - H * 0.32, H * 0.15, H * 0.32, 2, '#4a5d4f', 2.5);
      c.strokeStyle = '#3a3440'; c.lineWidth = 1.2; const lx0 = o + span * 0.05, lx1 = o + span * 0.95, ly = H * 0.22; c.beginPath(); c.moveTo(lx0, ly); c.quadraticCurveTo((lx0 + lx1) / 2, ly + 14, lx1, ly); c.stroke();
      const cols = ['#d6332a', '#f4ece0', '#2f6fd6', '#f6c343', '#3fb26a', '#e86aa6'];
      for (let i = 0; i < 9; i++) { const x = lx0 + (i + 0.5) * (lx1 - lx0) / 9, yy = ly + 14 * (1 - Math.pow((x - (lx0 + lx1) / 2) / ((lx1 - lx0) / 2), 2)) * 0.75; c.fillStyle = cols[(i + k * 2 + 6) % 6]; c.fillRect(x - 9, yy, 18, 22 + (i % 3) * 5); c.strokeStyle = OL; c.lineWidth = 1; c.strokeRect(x - 9, yy, 18, 22 + (i % 3) * 5); }
    }
    // the light from the court at the far end
    const gx = toward > 0 ? W : 0, gl = c.createRadialGradient(gx, H * 0.5, 10, gx, H * 0.5, W * 0.55); gl.addColorStop(0, 'rgba(255,236,170,.55)'); gl.addColorStop(1, 'rgba(255,236,170,0)'); c.fillStyle = gl; c.fillRect(0, 0, W, H);
    // ground
    c.fillStyle = '#6d6862'; c.fillRect(0, gY, W, H - gY); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, gY, W, 4);
    c.strokeStyle = 'rgba(40,36,40,.3)'; c.lineWidth = 1.5; for (let x = -(scroll % 140); x < W; x += 140) { c.beginPath(); c.moveTo(x, gY + 4); c.lineTo(x - 30, H); c.stroke(); }
    return gY;
  }
  function frontJunk(scroll) {   // potted plants and a drum in front of everything, moving fastest
    const span = Math.max(W * 0.9, 700), off = (scroll * 1.25) % span, y = H;
    for (let o = -off; o < W + span; o += span) {
      c.fillStyle = '#2f3a8a'; rr(o + span * 0.15, y - H * 0.11, H * 0.08, H * 0.14, 4, '#2f5fb8', 2.5);
      rr(o + span * 0.7, y - H * 0.06, H * 0.07, H * 0.08, 3, '#a35a3a', 2.5); c.fillStyle = '#3f8a52'; c.beginPath(); c.arc(o + span * 0.7 + H * 0.035, y - H * 0.08, H * 0.05, 0, 7); c.fill();
    }
  }
  const BALL = {
    cover: 2.2,
    init(T) { T.sc = 0; T.said = false; T.thud = false; T.say = 'Heads up!'; T.rot = 0; },
    draw(T, dt) {
      const t = T.t, fadeIn = clamp(t / 0.3, 0, 1), walkEnd = 1.25, tShout = 1.05, tBall = 1.5, tHit = 2.05;
      const h = clamp(H * 0.34, 120, 300), rx = lerp(-h * 0.4, W * 0.36, easeOut(clamp(t / walkEnd, 0, 1))), walking = t < walkEnd - 0.1;
      const scroll = easeOut(clamp(t / walkEnd, 0, 1)) * W * 0.35;
      if (t > tShout && !T.said) { T.said = true; shout('Heads up!'); tone(1600, 2400, 0.12, 'square', 0.02); }
      if (t > tHit && !T.thud) { T.thud = true; tone(130, 45, 0.35, 'sine', 0.5); noise(0.2, 400, 120, 0.25, 0.7); }
      T.rot += dt * 9;
      if (T.state !== 'reveal') {
        c.save(); c.globalAlpha = fadeIn;
        const gY = alley(T, scroll, 1);
        drawRJ(rx, gY + h * 0.02, h, 1, t * 9, { still: !walking, alert: t > tBall - 0.1 && t < tHit, look: t > tShout ? 1.2 : 0 });
        frontJunk(scroll);
        caption('DOWN THE ESKINITA', 'To the court', clamp((t - 0.15) / 0.3, 0, 1) * clamp((tShout + 0.2 - t) / 0.3, 0, 1), H * 0.15);
        // the shout, from somebody off to the right
        if (t > tShout) {
          const a = clamp((t - tShout) / 0.08, 0, 1), fs = clamp(H * 0.06, 20, 40); c.font = `${fs}px ${DISP}`; const tw = c.measureText('HEADS UP!').width + fs;
          const bx = W - tw - 14, by = H * 0.24, wob = Math.sin(t * 40) * 2 * (1 - clamp((t - tShout) / 0.4, 0, 1));
          c.save(); c.globalAlpha = a; c.translate(wob, 0); rr(bx, by, tw, fs * 1.6, fs * 0.4, '#fffdf3', 3);
          c.fillStyle = '#fffdf3'; c.beginPath(); c.moveTo(W - 40, by + fs * 1.6 - 2); c.lineTo(W + 4, by + fs * 2.3); c.lineTo(W - 70, by + fs * 1.6 - 2); c.closePath(); c.fill(); c.strokeStyle = OL; c.lineWidth = 3; c.beginPath(); c.moveTo(W - 40, by + fs * 1.6); c.lineTo(W + 4, by + fs * 2.3); c.lineTo(W - 70, by + fs * 1.6); c.stroke();
          c.fillStyle = '#d6332a'; c.textAlign = 'center'; c.fillText('HEADS UP!', bx + tw / 2, by + fs * 1.15); c.restore();
        }
        c.restore();

        const u = clamp((t - tBall) / (tHit - tBall), 0, 1), r0 = Math.max(10, H * 0.025), r = r0 * Math.pow(Rmax / r0, Math.pow(u, 2.3));
        const bx = lerp(W + r0, W * 0.5, easeOut(u)), by = lerp(H * 0.42, H * 0.5, u) - Math.sin(u * Math.PI) * H * 0.12;
        const shake = t > tHit && t < tHit + 0.18 ? (Math.random() - 0.5) * 16 : 0;
        if (u < 1) { c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 2; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(bx + r * 1.1, by - r * 0.6 + k * r * 0.4); c.lineTo(bx + r * (1.6 + k * 0.2), by - r * 0.6 + k * r * 0.4); c.stroke(); } }
        ballAt(bx + shake, by + shake, r, T.rot);
      }
      if (T.state === 'reveal') {   // it bounces off the lens and drops out of frame
        const v = clamp(T.r / 0.75, 0, 1), r = lerp(Rmax, H * 0.22, easeOut(v)), by = lerp(H * 0.5, H * 1.25 + r, v * v);

      }
    },
  };

  // ---------- 3. back out of the eskinita ----------
  const WALK = {
    cover: 1.55,
    init(T) { T.say = 'Back to the street.'; },
    draw(T, dt) {
      const t = T.t, h = clamp(H * 0.34, 120, 300), fadeIn = clamp(t / 0.25, 0, 1);
      if (T.state !== 'reveal') {
        c.save(); c.globalAlpha = fadeIn;
        const scroll = -t * W * 0.25, gY = alley(T, scroll, -1);
        drawRJ(lerp(W * 0.68, W * 0.42, clamp(t / 1.3, 0, 1)), gY + h * 0.02, h, -1, t * 9, { ball: true });

        caption('BACK TO THE STREET', 'Good run.', clamp((t - 0.1) / 0.3, 0, 1), H * 0.15);
        c.restore();
      }
      // an iris closes on Wesley, then opens on the street

      let rad = null;
      if (T.state !== 'reveal' && t > 0.85) rad = big * (1 - easeOut(clamp((t - 0.85) / (this.cover - 0.85), 0, 1)));
      if (T.state === 'reveal') { rad = big * ease(clamp(T.r / 0.6, 0, 1)); if (T.r >= 0.6) return true; }
      if (rad !== null) { c.save(); c.fillStyle = '#0c0a18'; c.beginPath(); c.rect(0, 0, W, H); c.moveTo(irisX + Math.max(0, rad), irisY); c.arc(irisX, irisY, Math.max(0, rad), 0, Math.PI * 2, true); c.fill('evenodd'); c.restore(); }
    },
  };

  const KINDS = { jeep: JEEP, ball: BALL, walk: WALK };
  function playTransition(kind) {
    const K = KINDS[kind]; size(); cv.classList.add('on');
    const T = { t: 0, r: 0, state: 'play', fast: 1 }; K.init(T); if (T.say) say.textContent = T.say;
    let coverRes, revealRes; const covered = new Promise((r) => (coverRes = r)), revealed = new Promise((r) => (revealRes = r));
    let last = performance.now();
    cv.onpointerdown = () => { if (T.state === 'play') T.fast = 3; };   // tap to hurry it along
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000) * (T.state === 'play' ? T.fast : 1); last = now;
      if (T.state === 'reveal') T.r += dt; T.t += dt;
      c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
      const done = K.draw(T, dt);
      if (T.state === 'play' && T.t >= K.cover) { T.state = 'hold'; coverRes(); }
      if (done) { c.clearRect(0, 0, W, H); cv.classList.remove('on'); cv.onpointerdown = null; revealRes(); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return { covered, reveal() { T.state = 'reveal'; T.r = 0; return revealed; } };
  }

  async function show(name, from, instant) {
    if (busy || name === current) return; busy = true;
    const kind = instant || reduce ? null : name === 'hub' && from === 'title' ? 'jeep' : name === 'court' ? 'ball' : name === 'hub' && from === 'court' ? 'walk' : null;
    let tr = null;
    if (kind) { mute = from ? isMuted(from) : false; tr = playTransition(kind); }
    else {
      const key = name === 'hub' && from === 'court' ? 'back' : name;
      const [big, small] = LINES[key] || ['', ''];
      fadeText.innerHTML = big + (small ? `<small>${small}</small>` : '');
      if (!instant) { fade.classList.add('on'); await wait(500); }
    }
    const fresh = !frames[name].dataset.loaded;
    // a scene has to be laid out (visible, under the cover) while it loads, or it measures a 0x0 screen
    const loading = (async () => { if (tr) await tr.covered; frames[name].style.zIndex = '1'; frames[name].hidden = false; await load(name); })();
    await loading;
    if (current) { post(current, { cmd: 'pause' }); frames[current].hidden = true; }
    frames[name].style.zIndex = ''; current = name;
    if (!fresh) post(name, { cmd: 'resume', from });
    try { frames[name].contentWindow.focus(); } catch (e) {}
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
    if (tr) { await wait(fresh ? 350 : 120); await tr.reveal(); }
    else if (!instant) { await wait(fresh ? 450 : 250); fade.classList.remove('on'); }
    busy = false;
  }

  window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (!m.go || !SRC[m.go]) return;
    const src = Object.keys(frames).find((k) => frames[k].contentWindow === e.source);
    if (!src) return;
    show(m.go, m.from || src);
  });

  // deep links: #hub or #court open straight into that scene
  const start = (location.hash || '').slice(1);
  show(SRC[start] ? start : 'title', null, true);
</script>
